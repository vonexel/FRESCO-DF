[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "fresco"
version = "0.1.2"
description = "Paired intervention audit of KAN forensic response curves"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.6.0", "torchvision==0.21.0", "open-clip-torch==2.32.0",
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2", "hydra-core==1.3.2", "tqdm>=4.66,<5",
  "matplotlib>=3.9,<4", "pillow>=10,<13", "opencv-python-headless>=4.10,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
scrfd = ["onnxruntime>=1.19,<2"]

[project.scripts]
fresco = "fresco.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fresco"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "fresco/configs"

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

